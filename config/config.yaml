icloud:
  enabled: true
  root: "C:/Users/kirk7/iCloudDrive"
  # Scope to folders you've downloaded locally. Add more as you download them.
  # Leave empty ([]) to scan all of iCloudDrive (slow, most files will be stubs).
  folders:
    - "Documents/AP/AE Software"

google_drive:
  enabled: false
  credentials_file: "config/gdrive_credentials.json"
  folder_ids: []

sync:
  enabled: true
  # Subfolder inside icloud.root where the built index (chunks, embeddings,
  # per-doc timestamps) is stored instead of next to config.yaml. Because it
  # lives under iCloud Drive, iCloud's own file sync mirrors it to every other
  # device signed into this account — a daemon or `cntxt query`/`cntxt index`
  # run elsewhere picks up already-embedded chunks instead of recomputing them.
  icloud_subdir: ".cntxt-sync"

chunking:
  chunk_size: 512
  chunk_overlap: 64
  context_window: 150

retrieval:
  alpha: 0.6    # vector weight in RRF (0 = pure BM25, 1 = pure vector)
  top_k: 5
  max_tokens: 4000

server:
  host: "127.0.0.1"
  port: 8765

anthropic:
  embedding_model: "voyage-3"
  batch_size: 64
